<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b1d2b">
<meta name="description" content="豌豆镇大冒险 —— 欧美卡通风格肉鸽小游戏，打开链接即玩">
<title>豌豆镇大冒险 · 肉鸽小游戏</title>
<style>
  :root { --ink: #2b1d2b; --cream: #fff6e2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--ink);
    font-family: "Baloo 2", "Fredoka", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    /* 微信 iOS 安全区 */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #game {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    background: radial-gradient(circle at 50% 30%, #4a3350 0%, #2b1d2b 70%);
  }
  #game canvas { display: block; touch-action: none; }

  /* 启动兜底界面（引擎未就绪时可见） */
  #boot {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding-top: 14vh;
    color: var(--cream); text-align: center; padding-left: 24px; padding-right: 24px;
    background: radial-gradient(circle at 50% 30%, #4a3350 0%, #2b1d2b 70%);
    transition: opacity .3s ease;
  }
  /* 底部读条（v0.8.1，与效果图一致）：HTML 阶段用 CSS 动画模拟，Phaser 接管后显示真进度
   * 宽度与游戏内读条对齐：368/720 ≈ 51.1% 画面宽；
   * 游戏画面宽 = min(100vw, 56.25vh)，故读条宽 = min(51.1vw, 28.75vh) */
  #boot .loadbar {
    position: absolute; left: 50%; top: 81.5%; transform: translateX(-50%);
    width: min(51.1vw, 28.75vh); height: auto; aspect-ratio: 368 / 40;
    background: #1d1428; border: 3px solid #fff6e2; border-radius: 8px;
    overflow: hidden;
  }
  #boot .loadbar i {
    position: absolute; inset: 0; width: 40%;
    background: linear-gradient(90deg, #6cc24a, #a8e063);
    border-radius: 4px;
    animation: bootbar 1.6s ease-in-out infinite;
  }
  @keyframes bootbar {
    0% { width: 8%; } 55% { width: 72%; } 100% { width: 96%; }
  }
  #boot .loadtip {
    position: absolute; left: 50%; top: calc(81.5% + 9vh); transform: translateX(-50%);
    font-size: min(2.8vh, 18px); color: #fff6e2; opacity: .85;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot img#boot-bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: -1;
  }
  #boot img#boot-logo { width: min(51.1vw, 28.75vh); height: auto; margin-bottom: 6px; }
  #boot .logo {
    font-size: 34px; font-weight: 800; letter-spacing: 2px;
    color: #ffe14d; text-shadow: 0 4px 0 #2b1d2b, 0 8px 18px rgba(0,0,0,.4);
  }
  #boot .sub { margin-top: 8px; font-size: 14px; opacity: .7; letter-spacing: 3px; }
  #boot .spin { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .boot-error { color: #ffd7d2; line-height: 1.7; }
  .boot-error h2 { color: #ffe14d; }

  /* 竖屏提示（横屏时给个符号，不强制） */
  @media (orientation: landscape) and (max-height: 520px) {
    #rotate-tip { display: block; }
  }
  #rotate-tip {
    display: none; position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    color: rgba(255,246,226,.6); font-size: 12px; z-index: 11; pointer-events: none;
  }
</style>
</head>
<body>
<div id="game"></div>

<div id="boot">
  <img id="boot-bg" src="assets/ui/boot_bg.png" alt="" style="display:none" data-fallback="assets/boot_bg.png">
  <img id="boot-logo" src="assets/ui/boot_logo.png" alt="豌豆镇大冒险" style="display:none" data-fallback="assets/boot_logo.png">
  <div class="logo" id="boot-logo-text">豌豆镇大冒险</div>
  <div class="sub" id="boot-logo-sub">PEA TOWN ROGUE</div>
  <div class="loadbar"><i></i></div>
  <div class="loadtip">资源加载中...</div>
  <div class="spin" id="boot-spin"></div>
</div>
<script>
  // 加载界面自定义图片：assets/ui/boot_bg.png（全屏背景）、assets/ui/boot_logo.png（logo）
  // 图片存在则自动启用并隐藏对应文字；不存在则保持原样（放图即生效，无需改代码）
  (function () {
    var bg = document.getElementById('boot-bg');
    var logo = document.getElementById('boot-logo');
    function enableBg() {
      bg.style.display = 'block';
      document.getElementById('boot').style.background = 'none';
    }
    function enableLogo() {
      logo.style.display = 'block';
      document.getElementById('boot-logo-text').style.display = 'none';
      document.getElementById('boot-logo-sub').style.display = 'none';
    }
    bg.addEventListener('load', enableBg);
    bg.addEventListener('error', function () {
      // 首选路径失败 → 尝试旧路径（assets/ 根目录）
      var fb = bg.getAttribute('data-fallback');
      if (fb && bg.src.indexOf('/' + fb.split('/').pop()) < 0 + 1 && bg.dataset.tried !== '1') {
        bg.dataset.tried = '1';
        bg.src = fb;
      } else {
        bg.style.display = 'none';
      }
    });
    logo.addEventListener('load', enableLogo);
    logo.addEventListener('error', function () {
      var fb = logo.getAttribute('data-fallback');
      if (fb && logo.dataset.tried !== '1') {
        logo.dataset.tried = '1';
        logo.src = fb;
      } else {
        logo.style.display = 'none';
      }
    });
  })();
</script>
<div id="rotate-tip">建议竖屏游玩</div>

<!-- 引擎：优先本地，其次 CDN（离线也能跑） -->
<script src="vendor/phaser.min.js"></script>
<script>
  if (!window.Phaser) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"><\/script>');
  }
</script>
<script>
  if (!window.Phaser) {
    document.write('<script src="https://unpkg.com/phaser@3.90.0/dist/phaser.min.js"><\/script>');
  }
</script>

<!-- 游戏代码：core 先于 scenes，Upgrade/Result 是被动场景，放最后 -->
<script src="js/core/data.js"></script>
<script src="js/core/art.js"></script>
<script src="js/core/sfx.js"></script>
<script src="js/core/run.js"></script>
<script src="js/core/meta.js"></script>
<script src="js/core/boot.js"></script>
<script src="js/core/devmode.js"></script>
<script src="js/systems/registry.js"></script>
<script src="js/ui/skin.js"></script>
<script src="js/ui/layout.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/avatar.js"></script>
<script src="js/scenes/Preload.js"></script>
<script src="js/scenes/Title.js"></script>
<script src="js/scenes/Game.js"></script>
<script src="js/ui/upgrade.js"></script>
<script src="js/ui/pause.js"></script>
<script src="js/ui/result.js"></script>
<script src="js/ui/lab.js"></script>
<script src="js/ui/shop.js"></script>
<script src="js/ui/leaderboard.js"></script>
<script src="js/ui/devpanel.js"></script>
<script src="js/ui/layoutdebug.js"></script>
<script src="js/ui/changelog.js"></script>
<script src="js/main.js"></script>
<script>
  // 引擎就绪后隐藏启动图
  (function () {
    var boot = document.getElementById('boot');
    var done = false;
    function hideBoot() {
      if (done || !boot) return;
      done = true;
      boot.classList.add('hide');
      setTimeout(function () { boot.style.display = 'none'; }, 400);
    }
    // 注册表合并要在 Preload 之前（放在最前面，避免被隐藏逻辑抢跑）
    try {
      if (window.RogueGame && window.RogueGame.Registry) window.RogueGame.Registry.merge();
    } catch (e) { console.warn('[豌豆镇] Registry.merge 失败', e); }

    // 轮询 canvas 出现
    var n = 0;
    var timer = setInterval(function () {
      n++;
      if (window.Phaser && document.querySelector('#game canvas')) {
        hideBoot();
        clearInterval(timer);
      } else if (n > 120) {          // 约 15 秒兜底：强制隐藏，露出报错信息
        clearInterval(timer);
        hideBoot();
        console.error('[豌豆镇] 引擎 15 秒内未就绪，请按 F12 查看 Console 报错');
      }
    }, 120);

    // 双保险：Phaser 的 READY 事件（如果引擎已加载）
    if (window.Phaser) {
      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (document.querySelector('#game canvas')) hideBoot();
        }, 1500);
      });
    }
    // 任何未捕获错误 → 立刻露出内容（否则错误被启动图盖住看不见）
    window.addEventListener('error', function (ev) {
      console.error('[豌豆镇] 未捕获错误:', ev.message, ev.filename + ':' + ev.lineno);
      hideBoot();
    });
  })();
</script>
</body>
</html>
